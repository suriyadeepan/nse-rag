[project]
name = "nse-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "cohere>=6.1.0",
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-openai>=0.8.0",
    "llama-index-llms-openai>=0.9.0",
    "llama-index-postprocessor-cohere-rerank>=0.11.0",
    "llama-index-retrievers-bm25>=0.9.0",
    "llama-index-vector-stores-chroma>=0.7.0",
    "openai>=3.60.0",
    "pymupdf>=2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
    "urllib3>=2.8.0",
]

[project.scripts]
nse-rag = "nse_rag:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
