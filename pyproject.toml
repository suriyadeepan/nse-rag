[project]
name = "nse-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
    "urllib3>=2.8.0",
]

[project.scripts]
nse-rag = "nse_rag:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
